services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8083}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-nutri_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutri}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nutri}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET deve ser definida no arquivo .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      REFRESH_TOKEN_SESSION_HOURS: ${REFRESH_TOKEN_SESSION_HOURS:-12}
      REFRESH_TOKEN_REMEMBER_DAYS: ${REFRESH_TOKEN_REMEMBER_DAYS:-30}
      REFRESH_TOKEN_SECURE_COOKIE: ${REFRESH_TOKEN_SECURE_COOKIE:-false}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutri_db}
      POSTGRES_USER: ${POSTGRES_USER:-nutri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutri}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
