spring:
  application:
    name: nutri.api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/nutri_db}
    username: ${SPRING_DATASOURCE_USERNAME:nutri}
    password: ${SPRING_DATASOURCE_PASSWORD:nutri}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8082}
